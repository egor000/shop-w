name: shop-assistant

x-app: &app
  image: shop-assistant:local
  environment: &environment
    DATABASE_URL: postgresql://shop:shop-local@db:5432/shop
    COOKIE_SECURE: "false"
  init: true

services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    profiles: [vllm]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_HUB_DISABLE_XET: "1"
    command:
      - --model
      - Qwen/Qwen3-1.7B
      - --served-model-name
      - Qwen/Qwen3-1.7B
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "8"
      - --gpu-memory-utilization
      - "0.80"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
    restart: unless-stopped

  db:
    image: postgres:16@sha256:bdbc203f612e315fdd33001f98ba0c300bb3b58a5d136fbb08dd377e8057e2b1
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local
      POSTGRES_DB: shop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ingest:
    <<: *app
    build: .
    command: ["python", "-m", "shop.ingest"]
    environment:
      <<: *environment
      QDRANT_URL: http://qdrant:6333
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  migrate:
    <<: *app
    build: .
    command: ["python", "-m", "shop.migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8091:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
    environment:
      <<: *environment
      QDRANT_URL: http://qdrant:6333
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "shop.worker"]
    environment:
      <<: *environment
      DETERMINISTIC_DELAY_SECONDS: "2"
      QDRANT_URL: http://qdrant:6333
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  maintenance:
    <<: *app
    command: ["python", "-m", "shop.maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  prometheus-data:
  tempo-data:
  grafana-data:
